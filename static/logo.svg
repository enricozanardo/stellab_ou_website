<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Stellab">
  <title>Stellab</title>
  <!-- Star + digital lab: five nodes as a constellation, circuit hub at centre -->
  <rect width="64" height="64" rx="14" fill="#0B1F2E"/>
  <g fill="none" stroke="#E8EEF2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Star arms as lab links -->
    <path d="M32 14 L32 28"/>
    <path d="M49.1 24.4 L37.5 31.2"/>
    <path d="M42.6 46.6 L34.2 36.4"/>
    <path d="M21.4 46.6 L29.8 36.4"/>
    <path d="M14.9 24.4 L26.5 31.2"/>
    <!-- Inner lab ring -->
    <circle cx="32" cy="32" r="7.5"/>
  </g>
  <!-- Outer star nodes -->
  <circle cx="32" cy="14" r="3.2" fill="#E8EEF2"/>
  <circle cx="49.1" cy="24.4" r="3.2" fill="#E8EEF2"/>
  <circle cx="42.6" cy="46.6" r="3.2" fill="#E8EEF2"/>
  <circle cx="21.4" cy="46.6" r="3.2" fill="#E8EEF2"/>
  <circle cx="14.9" cy="24.4" r="3.2" fill="#E8EEF2"/>
  <!-- Signal / lab core -->
  <circle cx="32" cy="32" r="3.6" fill="#1FA7A0"/>
</svg>
